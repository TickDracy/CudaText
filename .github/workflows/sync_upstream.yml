name: Sync Fork with Upstream

on:
  schedule:
    - cron: '45 23 * * 6'  # Every Saturday at 23:45 UTC
  workflow_dispatch: 

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN cannot push commits that modify .github/workflows/*.
      # If upstream changes a workflow file, add a PAT with "repo" + "workflow"
      # scopes as the SYNC_TOKEN secret; it is used automatically when present.
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Alexey-T/CudaText.git
          git fetch upstream master

      - name: Rebase fork commits onto upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork already contains upstream/master. Nothing to do."
            exit 0
          fi

          echo "Fork-only commits:"
          git log --oneline upstream/master..HEAD

          # Linear history: replay fork-only commits on top of upstream (no merge commits)
          if ! git rebase upstream/master; then
            git rebase --abort
            echo "::error::Rebase conflict. Resolve manually: git rebase upstream/master"
            exit 1
          fi

          git push --force-with-lease=master:${{ github.sha }} origin master
          echo "Fork synced with upstream."
